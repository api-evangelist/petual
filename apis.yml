name: Petual
description: >-
  Petual is a direct-to-consumer pet wellness brand offering functional soft
  chews for dogs. The company sells six formulas — Thrive (daily longevity),
  Steady (calm & stress), Nourish (digestive & gut health), Soothe (skin &
  allergy), Spring (mobility & joint), and Lean (healthy weight & metabolism) —
  each an apothecary-style canister of 90 chews (9.5 oz) positioned as a daily
  ritual for a longer, healthier canine life. Backed by a16z and Cowboy
  Ventures. Petual publishes a consumer storefront only — no public API,
  developer portal, documentation, SDKs, OpenAPI, well-known discovery, or agent
  surface was found. This profile tracks the company as a network lead and will
  be enriched if and when a developer program appears.
